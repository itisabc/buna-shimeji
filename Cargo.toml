[package]
name = "shimeji"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "Shimeji desktop mascot reimplementation in Rust (tao + windows-rs)"
repository = "https://github.com/itisabc/buna-shimeji"
homepage = "https://github.com/itisabc/buna-shimeji"
readme = "README.md"
keywords = ["shimeji", "desktop-mascot", "windows", "tao"]

[dependencies]
# ウィンドウ / イベントループ（tao 0.37: WaitUntil 対応、Phase 0 ビルド実績あり）
tao = "0.37"
# Win32（tao 0.37 と共通依存になるバージョン。Phase 0 実績: windows 0.62.2）
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
# XML パース（conf/actions.xml, behaviors.xml）
roxmltree = "0.21"
# PNG デコード（資産は PNG のみ。軽量化のため png 限定）
image = { version = "0.25", default-features = false, features = ["png"] }
# トレイ
tray-icon = "0.24"
# 設定永続化（conf/settings.toml・タスク #9c）
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# エラー
thiserror = "2"
anyhow = "1"
# ログ
log = "0.4"
env_logger = "0.11"

[build-dependencies]
# exe アイコン埋め込み（Java 版 icon.ico 準拠、タスク #24）
winresource = "0.1"
