[package]
name = "simeji"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "Shimeji desktop mascot reimplementation in Rust (tao + windows-rs)"

[dependencies]
# ウィンドウ / イベントループ（tao 0.37: WaitUntil 対応、Phase 0 ビルド実績あり）
tao = "0.37"
# 描画（WS_EX_LAYERED）用。スパイク検証の対照実験のみで使用（design §6）。
# 結論: softbuffer は UpdateLayeredWindow を呼ばないため不採用 → #5 で依存ごと削除予定
softbuffer = "0.4"
# Win32（tao 0.37 と共通依存になるバージョン。Phase 0 実績: windows 0.62.2）
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
# XML パース（conf/actions.xml, behaviors.xml）
roxmltree = "0.21"
# PNG デコード（資産は PNG のみ。軽量化のため png 限定）
image = { version = "0.25", default-features = false, features = ["png"] }
# トレイ
tray-icon = "0.24"
# エラー
thiserror = "2"
anyhow = "1"
# ログ
log = "0.4"
env_logger = "0.11"
